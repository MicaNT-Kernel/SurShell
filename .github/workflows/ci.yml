name: SurShell CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows (MSVC)"
            os: windows-latest
            build_type: Release
            generator: ""
          - name: "Windows (MSVC)"
            os: windows-latest
            build_type: Debug
            generator: ""
          - name: "Linux (GCC)"
            os: ubuntu-latest
            build_type: Release
            generator: "-G Ninja"
          - name: "Linux (GCC)"
            os: ubuntu-latest
            build_type: Debug
            generator: "-G Ninja"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - name: Configure CMake
        run: >
          cmake -B build ${{ matrix.generator }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build SurShell
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
